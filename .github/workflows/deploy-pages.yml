# TalkCash web (Expo export) -> Cloudflare Pages otomatik deploy
# Gerekli GitHub Secrets (repo -> Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  : Account > Cloudflare Pages > Edit izinli token
#   CLOUDFLARE_ACCOUNT_ID : hesap ID (32 haneli hex)
name: Deploy Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Export web bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://talkcash-api-prod.onrender.com/api/v1' }}
          EXPO_PUBLIC_APP_ENV: production
        run: npx expo export --platform web

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 pages deploy mobile/dist \
            --project-name=talkcash \
            --branch=main \
            --commit-dirty=true
