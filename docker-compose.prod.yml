# Production overlay â€” no dev volume mounts, restart policy, hardened defaults.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# GEREKLI ortam degiskenleri (yoksa compose hata verir, default sifreyle ayrilamaz):
#   POSTGRES_PASSWORD   guclu rastgele sifre
#   REDIS_PASSWORD      guclu rastgele sifre
#   MINIO_ROOT_PASSWORD guclu rastgele sifre
#   SECRET_KEY          32+ karakter JWT anahtari
#
# Guvenlik notlari:
#   - DB/Redis/MinIO portlari yalnizca 127.0.0.1'e baglanir (host'a acik degil)
#   - MinIO bucket'i ANONIM OKUMAYA KAPALI olusturulur (fis gorselleri private;
#     erisim presigned URL ile)

services:
  backend:
    restart: unless-stopped
    volumes: []   # override dev bind-mount
    environment:
      SCHEDULER_ENABLED: "true"
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      GOOGLE_PLAY_VERIFY_MOCK: "false"
      APPLE_VERIFY_MOCK: "false"
      BILLING_PREMIUM_UNLOCKED: "false"
      DATABASE_URL: postgresql+asyncpg://talkcash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_gerekli}@db:5432/talkcash
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD_gerekli}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY_gerekli_en_az_32_karakter}
      S3_ACCESS_KEY: talkcash
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_gerekli}

  db:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_gerekli}

  redis:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD_gerekli}"]

  minio:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_gerekli}

  minio-init:
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 talkcash $${MINIO_ROOT_PASSWORD};
      mc mb local/talkcash --ignore-existing;
      exit 0;
      "
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD_gerekli}

